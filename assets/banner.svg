<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Wanna Clip banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0b16"/><stop offset="1" stop-color="#07070b"/></linearGradient>
    <radialGradient id="g1" cx="12%" cy="0%" r="60%"><stop offset="0" stop-color="#7b5cff" stop-opacity=".45"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="100%" cy="10%" r="55%"><stop offset="0" stop-color="#b266ff" stop-opacity=".30"/><stop offset="1" stop-color="#b266ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d4c4ff"/><stop offset="1" stop-color="#9d7dff"/></linearGradient>
    <linearGradient id="seg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6bff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1f55"/><stop offset="1" stop-color="#120e24"/></linearGradient>
    <filter id="glow" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="trk"><rect x="72" y="282" width="1136" height="44" rx="12"/></clipPath>
  </defs>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
    <rect width="1280" height="360" rx="24" fill="url(#g1)"/>
    <rect width="1280" height="360" rx="24" fill="url(#g2)"/>
    <rect x=".5" y=".5" width="1279" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- eyebrow -->
    <circle cx="82" cy="75" r="5" fill="#ffb224" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="98" y="80" font-size="14" font-weight="600" letter-spacing="3" fill="#9494a8">YOUTUBE &#8594; VIRAL CLIPS</text>

    <!-- title -->
    <text x="72" y="152" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#title)">Wanna Clip</text>
    <text x="74" y="194" font-size="21" fill="#a9a9bd">Find the moment. Add the captions. Ship the clip.</text>

    <!-- chips -->
    <g font-size="13" font-weight="600" fill="#d4c4ff">
      <rect x="72" y="222" width="116" height="32" rx="16" fill="#8f6bff" fill-opacity=".14" stroke="#8f6bff" stroke-opacity=".5"/><text x="130" y="243" text-anchor="middle">9:16 Shorts</text>
      <rect x="198" y="222" width="94" height="32" rx="16" fill="#8f6bff" fill-opacity=".14" stroke="#8f6bff" stroke-opacity=".5"/><text x="245" y="243" text-anchor="middle">16:9 HD</text>
      <rect x="302" y="222" width="142" height="32" rx="16" fill="#8f6bff" fill-opacity=".14" stroke="#8f6bff" stroke-opacity=".5"/><text x="373" y="243" text-anchor="middle">Pop-up captions</text>
      <rect x="454" y="222" width="116" height="32" rx="16" fill="#8f6bff" fill-opacity=".14" stroke="#8f6bff" stroke-opacity=".5"/><text x="512" y="243" text-anchor="middle">Glitch cuts</text>
    </g>

    <!-- phone mockup -->
    <g transform="translate(1048 34) rotate(5 66 118)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/>
      <rect width="132" height="236" rx="20" fill="url(#phone)" stroke="#8f6bff" stroke-opacity=".6" stroke-width="2"/>
      <rect x="46" y="9" width="40" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
      <circle cx="66" cy="92" r="22" fill="#ffffff" fill-opacity=".1"/>
      <path d="M59 80 L79 92 L59 104 Z" fill="#ffffff" fill-opacity=".85"/>
      <rect x="12" y="150" width="108" height="46" rx="10" fill="#8f6bff"/>
      <text x="66" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">THIS IS</text>
      <text x="66" y="188" text-anchor="middle" font-size="17" font-weight="900" fill="#ffb224">VIRAL</text>
      <rect x="12" y="210" width="108" height="4" rx="2" fill="#ffffff" fill-opacity=".15"/>
      <rect x="12" y="210" width="44" height="4" rx="2" fill="#ffb224"><animate attributeName="width" values="8;108;8" dur="9s" repeatCount="indefinite"/></rect>
    </g>

    <!-- timeline -->
    <rect x="72" y="282" width="1136" height="44" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
    <g clip-path="url(#trk)" stroke="#ffffff" stroke-opacity=".06">
      <path d="M104 282V326M136 282V326M168 282V326M200 282V326M232 282V326M264 282V326M296 282V326M328 282V326M360 282V326M392 282V326M424 282V326M456 282V326M488 282V326M520 282V326M552 282V326M584 282V326M616 282V326M648 282V326M680 282V326M712 282V326M744 282V326M776 282V326M808 282V326M840 282V326M872 282V326M904 282V326M936 282V326M968 282V326M1000 282V326M1032 282V326M1064 282V326M1096 282V326M1128 282V326M1160 282V326M1192 282V326"/>
    </g>
    <g font-size="11" font-weight="700" fill="#ffffff">
      <rect x="208" y="288" width="273" height="32" rx="8" fill="url(#seg)" opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.11;.13;.35;.38;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="220" y="308">12:12&#8211;15:09</text>
      <rect x="595" y="288" width="159" height="32" rx="8" fill="url(#seg)" opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.45;.47;.59;.62;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="607" y="308">16:00&#8211;16:54</text>
      <rect x="890" y="288" width="182" height="32" rx="8" fill="url(#seg)" opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.71;.73;.87;.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="902" y="308">20:30</text>
    </g>
    <rect x="72" y="278" width="3" height="52" rx="1.5" fill="#ffb224" filter="url(#glow)"><animate attributeName="x" values="72;1205" dur="9s" repeatCount="indefinite"/></rect>
  </g>
</svg>
